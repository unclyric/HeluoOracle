            '001111','101100','001011','111011','011010','110010','011101','100100',
            '010010','101010','111101','011111','000100','010100','011000','100101',
            '100111','010110','101001','011001','111110','000110','101011','010000',
            '010101','001100','001101','011011','100010','101111','111010','000010'];
        return order.indexOf(key) + 1;
    }

    // 六爻状态
    let liuyaoState = {
        coins: [true, true, true], // true=字(背), false=花(面)
        yaos: [], // 记录每一爻: {backCount, type, yaoValue}
        currentYao: 1 // 当前第几爻 (1-6)
    };

    // 点击铜钱翻转
    function flipCoin(index) {
        liuyaoState.coins[index] = !liuyaoState.coins[index];
        updateCoinDisplay();
    }

    // 更新铜钱显示
    function updateCoinDisplay() {
        for (let i = 0; i < 3; i++) {
            let el = document.getElementById('coin' + (i + 1));
            let lb = document.getElementById('coinLabel' + (i + 1));
            if (liuyaoState.coins[i]) {
                el.className = 'coin head';
                if (lb) lb.textContent = '字';
            } else {
                el.className = 'coin tail';
                if (lb) lb.textContent = '花';
            }
        }
    }

    // 掷铜钱
    function throwCoins() {
        if (liuyaoState.currentYao > 6) return;

        // 随机掷出
        for (let i = 0; i < 3; i++) {
            liuyaoState.coins[i] = Math.random() > 0.5;
        }
        updateCoinDisplay();

        // 计算背数 (字=背=3, 花=面=2)
        let backCount = liuyaoState.coins.filter(c => c).length;
        let faceCount = 3 - backCount;
        let total = backCount * 3 + faceCount * 2; // 6,7,8,9

        // 判断爻的类型
        let type, yaoValue;
        if (total === 6) { type = '老阴'; yaoValue = 0; }       // 三个花 → 老阴(动爻) ▬ ▬ ×
        else if (total === 7) { type = '少阳'; yaoValue = 1; }  // 两花一字 → 少阳 ▬▬▬
        else if (total === 8) { type = '少阴'; yaoValue = 0; }  // 一花两字 → 少阴 ▬ ▬
        else if (total === 9) { type = '老阳'; yaoValue = 1; }  // 三个字 → 老阳(动爻) ▬▬▬ ○

        liuyaoState.yaos.push({ backCount, faceCount, total, type, yaoValue });

        // 更新爻记录显示
        updateYaoDisplay();

        liuyaoState.currentYao++;

        if (liuyaoState.currentYao <= 6) {
            document.getElementById('yaoProgress').textContent = `第 ${liuyaoState.currentYao} 爻 / 共 6 爻（从下往上）`;
        } else {
            document.getElementById('yaoProgress').textContent = '卦已成';
            document.getElementById('throwBtn').disabled = true;
            document.getElementById('throwBtn').style.opacity = '0.3';
            // 显示卦象结果
            setTimeout(showGuaResult, 500);
        }
    }

    // 更新爻显示
    function updateYaoDisplay() {
        let html = '';
        liuyaoState.yaos.forEach((yao, i) => {
            let yaoNum = i + 1;
            let symbol = '';
            let cssClass = '';

            if (yao.type === '老阴') {
                symbol = '▬ ▬ ×';
                cssClass = 'dong-yin';
            } else if (yao.type === '老阳') {
                symbol = '▬▬▬ ○';
                cssClass = 'dong-yang';
            } else if (yao.type === '少阳') {
                symbol = '▬▬▬';
                cssClass = 'yang';
            } else {
                symbol = '▬ ▬';
                cssClass = 'yin';
            }

            html += `<div class="yao-line ${cssClass}">
                <span class="yao-label">第${yaoNum}爻</span>
                <span class="yao-symbol">${symbol}</span>
                <span class="yao-type">${yao.backCount}背${yao.faceCount}面 ${yao.type}</span>
            </div>`;
        });
        document.getElementById('yaoRecord').innerHTML = html;
    }

    // 显示卦象结果
    function showGuaResult() {
        // 从下到上取爻值组成卦象
        let lowerYao = liuyaoState.yaos.slice(0, 3).map(y => y.yaoValue);
        let upperYao = liuyaoState.yaos.slice(3, 6).map(y => y.yaoValue);

        // 查找上下卦
        let lowerGua = findBagua(lowerYao);
        let upperGua = findBagua(upperYao);

        // 组合键
        let guaKey = upperYao.join('') + lowerYao.join('');
        let guaData = GUA64[guaKey];

        // 检查动爻（变卦）
        let dongYaoList = [];
        liuyaoState.yaos.forEach((yao, i) => {
            if (yao.type === '老阴' || yao.type === '老阳') {
                dongYaoList.push(i + 1);
            }
        });

        // 计算变卦
        let bianGuaKey = null;
        let bianGuaName = '';
        if (dongYaoList.length > 0) {
            let bianYao = liuyaoState.yaos.map(y => {
                if (y.type === '老阴') return 1; // 阴变阳
                if (y.type === '老阳') return 0; // 阳变阴
                return y.yaoValue;
            });
            let bianLower = bianYao.slice(0, 3);
            let bianUpper = bianYao.slice(3, 6);
            bianGuaKey = bianUpper.join('') + bianLower.join('');
            let bianData = GUA64[bianGuaKey];
            if (bianData) bianGuaName = bianData[2];
        }

        // 生成卦象符号
        let guaSymbolHtml = buildGuaSymbol(upperYao, lowerYao);

        let html = `<div class="gua-name">${guaData ? guaData[2] : '未知卦'}</div>`;
        html += `<div class="gua-symbol">${guaSymbolHtml}</div>`;
        html += `<div class="gua-detail">`;
        html += `<div><b>上卦：</b>${upperGua}（${BAGUA_SYMBOL[upperGua] || ''}）</div>`;
        html += `<div><b>下卦：</b>${lowerGua}（${BAGUA_SYMBOL[lowerGua] || ''}）</div>`;
        html += `<div><b>卦辞：</b>${guaData ? guaData[3] : ''}</div>`;
        if (dongYaoList.length > 0) {
            html += `<div style="margin-top:10px;"><b>动爻：</b>第 ${dongYaoList.join('、')} 爻</div>`;
            if (bianGuaName) {
                html += `<div><b>变卦：</b>${bianGuaName}</div>`;
            }
            html += `<div style="color:#ff6666;margin-top:5px;">有动爻，本卦为事之始，变卦为事之终</div>`;
        } else {
            html += `<div style="margin-top:10px;color:#aaa;">无动爻，以本卦断之</div>`;
        }
        // 爻辞简要
        html += `<div style="margin-top:10px;border-top:1px solid #333;padding-top:10px;">`;
        html += `<b>六爻详情：</b></div>`;
        liuyaoState.yaos.forEach((yao, i) => {
            let isDong = yao.type === '老阴' || yao.type === '老阳';
            html += `<div style="${isDong ? 'color:#ff6666;' : ''}">第${i+1}爻：${yao.backCount}背${yao.faceCount}面 → ${yao.type}${isDong ? '（动）' : ''}</div>`;
        });
        html += `</div>`;

        document.getElementById('guaResult').innerHTML = html;
        document.getElementById('guaResult').style.display = 'block';
    }

    // 查找八卦名
    function findBagua(yaoArr) {
        for (let name in BAGUA_YAO) {
            let arr = BAGUA_YAO[name];
            if (arr[0] === yaoArr[0] && arr[1] === yaoArr[1] && arr[2] === yaoArr[2]) {
                return name;
            }
        }
        return '未知';
    }

    // 构建卦象符号
    function buildGuaSymbol(upperYao, lowerYao) {
        let lines = [];
        // 上卦（从上到下）
        upperYao.forEach(v => {
            lines.push(v === 1 ? '▬▬▬' : '▬ ▬');
        });
        lines.push('─────'); // 分隔线
        // 下卦（从上到下）
        lowerYao.forEach(v => {
            lines.push(v === 1 ? '▬▬▬' : '▬ ▬');
        });
        return lines.join('<br>');
    }

    // 重置六爻
    function resetLiuyao() {
        liuyaoState = {
            coins: [true, true, true],
            yaos: [],
            currentYao: 1
        };
        updateCoinDisplay();
        document.getElementById('yaoRecord').innerHTML = '';
        document.getElementById('guaResult').style.display = 'none';
        document.getElementById('guaResult').innerHTML = '';
        document.getElementById('yaoProgress').textContent = '第 1 爻 / 共 6 爻（从下往上）';
        document.getElementById('throwBtn').disabled = false;
        document.getElementById('throwBtn').style.opacity = '1';
    }
    // ==================== 奇门遁甲排盘 ====================
    const QM_JU = [
        [1,7,4],[2,8,5],[3,9,6],[8,5,2],[9,6,3],[1,7,4],[3,9,6],[4,1,7],[5,2,8],[4,1,7],[5,2,8],[6,3,9],
        [9,3,6],[8,2,5],[7,1,4],[2,5,8],[1,4,7],[9,3,6],[7,1,4],[6,9,3],[5,8,2],[6,9,3],[5,8,2],[4,7,1]
    ];
    const QM_STARS = ['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
    const QM_DOORS = ['休','生','伤','杜','景','死','惊','开'];
    const QM_SPIRITS_YANG = ['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
    const QM_SPIRITS_YIN = ['值符','九天','九地','玄武','白虎','六合','太阴','螣蛇'];
    const QM_STAR_POS = {天蓬:1,天芮:2,天冲:3,天辅:4,天禽:5,天心:6,天柱:7,天任:8,天英:9};
    const QM_DOOR_POS = {休:1,生:8,伤:3,杜:4,景:9,死:2,惊:7,开:6};
    const QM_DZ = {1:'子',2:'未申',3:'卯',4:'辰巳',5:'',6:'戌亥',7:'酉',8:'丑寅',9:'午'};
    const QM_NAMES = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};

    const YD_FLIGHT = [1,2,3,4,5,6,7,8,9];
    const YING_FLIGHT = [9,8,7,6,5,4,3,2,1];

    // 符头：上元=甲子/己卯/甲午/己酉, 中元=甲戌/己丑/甲辰/己未, 下元=甲申/己亥/甲寅/己巳
    function getQMFuTou(dayGZIdx) {
        let ftMap = {0:0,15:0,30:0,45:0, 10:1,25:1,40:1,55:1, 20:2,35:2,50:2,5:2};
        for (let back = 0; back < 10; back++) {
            let idx = (dayGZIdx - back + 60) % 60;
            if (ftMap[idx] !== undefined) return {ft:idx, yuan:ftMap[idx], offset:back};
        }
        return {ft:0, yuan:0, offset:0};
    }

    // 24节气近似DOY
    const JQ24_DOY = [355,5,20,35,50,65,80,95,110,126,141,157,172,188,203,219,234,251,266,281,296,311,326,341];

    function getQMJu(doy, year, yuan) {
        let diy = isLeapYear(year) ? 366 : 365;
        // 找当前日期所属节气（上一个已过节气）
        let jqIdx = 0;
        for (let i = 0; i < 24; i++) {
            let d = JQ24_DOY[i];
            if (d > diy) d -= diy;
            if (doy >= d) jqIdx = i;
        }
        jqIdx = jqIdx % 24;
        let row = QM_JU[jqIdx];
        if (!row) row = [1,7,4];
        let ju = row[yuan];
        let isYang = jqIdx < 12; // 冬至~芒种=阳遁
        return {ju, isYang, jqIdx};
    }

    function qimenJiXing(yi, palace) {
        let checks = {戊:[3],己:[2],庚:[8],辛:[9],壬:[4],癸:[4]};
        return checks[yi] && checks[yi].includes(palace);
    }

    function qimenRuMu(yi, palace) {
        let mu = {甲:2,乙:6,丙:6,丁:8,戊:6,己:8,庚:8,辛:4,壬:4,癸:2};
        return mu[yi[0]] === palace;
    }

    function getQimenKongWang(dayGZIdx) {
        let xs = dayGZIdx - (dayGZIdx % 10);
        let xsZhi = xs % 12;
        return [(xsZhi - 2 + 12) % 12, (xsZhi - 1 + 12) % 12];
    }

    function getQimenMaXingPalace(hourZhiIdx) {
        let h = hourZhiIdx;
        if (h === 2 || h === 6 || h === 10) return 2;  // 寅午戌→马在申→坤2
        if (h === 8 || h === 0 || h === 4) return 8;   // 申子辰→马在寅→艮8
        if (h === 5 || h === 9 || h === 1) return 6;   // 巳酉丑→马在亥→乾6
        return 4; // 亥卯未→马在巳→巽4
    }

    function paiQiMen() {
        const now = new Date();
        const year = now.getFullYear(), month = now.getMonth() + 1, day = now.getDate();
        const lon = parseFloat(document.getElementById('qimenLongitude').value) || 120;
        const si = calcTrueSolarTime(String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'), lon, month, day, year);
        const [solarH, solarM] = si.trueSolarTime.split(':').map(Number);
        const hour = solarH, minute = solarM;
        const timeStr = String(hour).padStart(2,'0') + ':' + String(minute).padStart(2,'0');

        // 日干支
        const dayGZ = calcDayGanZhi(year, month, day);
        // 时干支
        const hourZhiIdx = getShiChenFromTime(timeStr);
        const hGanIdx = (wushudun(dayGZ.ganIdx) + hourZhiIdx) % 10;
        const hourGan = TIANGAN[hGanIdx], hourZhi = DIZHI[hourZhiIdx];
        const hourGZIdx = getGzIdx(hGanIdx, hourZhiIdx);

        // 符头与局数
        const ftInfo = getQMFuTou(dayGZ.gzIdx);
        let doy = dayOfYear(month, day, year);
        const {ju, isYang} = getQMJu(doy, year, ftInfo.yuan);

        // 地盘奇仪
        let flight = isYang ? YD_FLIGHT : YING_FLIGHT;
        let dp = {}; // palace → yi
        let yiList = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
        let startIdx = flight.indexOf(ju);
        for (let i = 0; i < 9; i++) {
            let pal = flight[(startIdx + i) % 9];
            dp[pal] = yiList[i];
        }

        // 时柱旬首 → 六仪映射（甲子戊、甲戌己、甲申庚、甲午辛、甲辰壬、甲寅癸）
        let xs = hourGZIdx - (hourGZIdx % 10);
        let xsZhiIdx = xs % 12;
        let xsYiMap = {0:'戊', 10:'己', 20:'庚', 30:'辛', 40:'壬', 50:'癸'};
        let xsYiTarget = xsYiMap[xs] || '戊';

        // 值符星：找旬首六仪在地盘的位置
        let xsPal = null;
        for (let pal = 1; pal <= 9; pal++) {
            if (dp[pal] === xsYiTarget) { xsPal = pal; break; }
        }
        if (!xsPal) xsPal = ju;
        if (xsPal === 5) xsPal = 2; // 中五寄坤
        let zhifuStar = QM_STARS[xsPal - 1] || '天禽';

        // 值使门
        let xsHourDiff = (hourZhiIdx - xsZhiIdx + 12) % 12;
        let zhishiPal = ((xsPal - 1 + xsHourDiff) % 9) + 1;
        if (zhishiPal === 5) zhishiPal = 2;

        // 时干落宫
        let shiGanPal = null;
        for (let pal = 1; pal <= 9; pal++) {
            if (dp[pal] === hourGan) { shiGanPal = pal; break; }
        }
        if (!shiGanPal) shiGanPal = ju;

        // 天盘星
        let tpStar = {};
        let starOrder = [];
        for (let i = 0; i < 9; i++) starOrder.push(QM_STARS[(xsPal - 1 + i) % 9]);
        let sfIdx = starOrder.indexOf(zhifuStar);
        for (let i = 0; i < 9; i++) {
            let pal = flight[(flight.indexOf(shiGanPal) - sfIdx + i + 9) % 9];
            tpStar[pal] = starOrder[i];
        }

        // 人盘门
        let tpDoor = {};
        let doorOrder = [];
        for (let i = 0; i < 8; i++) doorOrder.push(QM_DOORS[(QM_DOORS.indexOf('休') + xsPal - 1 + i) % 8]);
        let doorStart = doorOrder[0]; // 值使门
        let doorIdx2 = doorOrder.indexOf(doorStart);
        for (let i = 0; i < 8; i++) {
            let pal = ((zhishiPal - 1 + i) % 9) + 1;
            if (pal === 5) pal = 2; // 寄坤
            tpDoor[pal] = doorOrder[i];
        }

        // 神盘
        let tpSpirit = {};
        let spirits = isYang ? QM_SPIRITS_YANG : QM_SPIRITS_YIN;
        for (let i = 0; i < 8; i++) {
            let pal = ((shiGanPal - 1 + i) % 9) + 1;
            if (pal === 5) pal = 2;
            tpSpirit[pal] = spirits[i];
        }

        // 天盘奇仪 (随天盘星旋转 = 地盘奇仪旋转)
        let tpYi = {};
        let rotOffset = (shiGanPal - ju + 9) % 9;
        for (let pal = 1; pal <= 9; pal++) {
            let oldPal = flight[(flight.indexOf(pal) - rotOffset + 9) % 9];
            tpYi[pal] = dp[oldPal] || '';
        }

        // 暗干（值使门起）
        let ag = {};
        let agStart = zhishiPal;
        for (let i = 0; i < 10; i++) {
            let pal = ((agStart - 1 + i) % 9) + 1;
            if (pal === 5) pal = 2;
            if (!ag[pal]) ag[pal] = TIANGAN[(TIANGAN.indexOf(hourGan) + i) % 10];
        }

        // 空亡
        let kwZhi = getQimenKongWang(dayGZ.gzIdx);
        let kwPalaces = new Set();
        for (let pal = 1; pal <= 9; pal++) {
            let dzs = QM_DZ[pal].split('');
            dzs.forEach(d => { if (kwZhi.includes(DIZHI.indexOf(d))) kwPalaces.add(pal); });
        }

        // 马星
        let maPal = getQimenMaXingPalace(hourZhiIdx);

        // 显示
        const matterText = document.getElementById('qimenMatter').value.trim();
        let info = (isYang ? '阳遁' : '阴遁') + ju + '局　' +
            '日' + dayGZ.gan + dayGZ.zhi + '　时' + hourGan + hourZhi + '　' +
            '值符' + zhifuStar + '　值使' + doorStart +
            (matterText ? '　事由：' + matterText : '');
        document.getElementById('qimenResult').style.display = 'block';
        document.getElementById('qimenInfo').innerHTML = info;

        let gridHtml = '';
        let gridOrder = [4,9,2,3,5,7,8,1,6];
        gridOrder.forEach(pal => {
            let cells = [];
            let dpyi = dp[pal] || '';
            let dpxCls = WX_CLASS[GAN_WX[dpyi]] || '';
            let star = tpStar[pal] || '';
            let tpyi = tpYi[pal] || '';
            let tyCls = WX_CLASS[GAN_WX[tpyi]] || '';
            let door = tpDoor[pal] || '';
            let spirit = tpSpirit[pal] || '';
            let agan = ag[pal] || '';
            let agCls = WX_CLASS[GAN_WX[agan]] || '';

            // 击刑/入墓 对天盘奇仪和地盘奇仪的颜色标记
            let tpJX = false, tpRM = false, dpJX = false, dpRM = false;
            if (tpyi) { tpJX = qimenJiXing(tpyi, pal); tpRM = qimenRuMu(tpyi, pal); }
            if (dpyi) { dpJX = qimenJiXing(dpyi, pal); dpRM = qimenRuMu(dpyi, pal); }
            // 天干色：击刑=紫色，入墓+击刑=蓝色，否则按五行
            let tpYiCls = (tpJX && tpRM) ? 'qm-jxrm' : (tpJX ? 'qm-jx' : tyCls);
            let dpYiCls = (dpJX && dpRM) ? 'qm-jxrm' : (dpJX ? 'qm-jx' : dpxCls);

            // Palace header
            cells.push('<div class="qm-palace">' + QM_NAMES[pal] + '宫 ' + (QM_DZ[pal]||'中') + '</div>');
            // Star + heaven yi (击刑=紫色天干, 入墓+击刑=蓝色天干)
            cells.push('<div class="qm-star">' + star + ' <span class="' + tpYiCls + '">' + tpyi + '</span></div>');
            // Door
            cells.push('<div class="qm-door">' + (door || '—') + '</div>');
            // Spirit
            cells.push('<div class="qm-spirit">' + (spirit || '—') + '</div>');
            // Earth yi (同样标记击刑/入墓色)
            cells.push('<div class="qm-dp">地<span class="' + dpYiCls + '">' + dpyi + '</span></div>');
            // 暗干
            if (agan) cells.push('<div class="qm-ag">暗<span class="' + agCls + '">' + agan + '</span></div>');
            // 入墓/空亡/马星标签
            let markers = [];
            if (tpyi && tpRM && !tpJX) markers.push('<span class="qm-jxrm">入墓</span>');
            if (dpyi && dpRM && !dpJX) markers.push('<span class="qm-jxrm">地入墓</span>');
            if (kwPalaces.has(pal)) markers.push('<span class="qm-kw">空亡</span>');
            if (pal === maPal) markers.push('<span class="qm-ma">马星</span>');
            if (markers.length > 0) cells.push('<div style="margin-top:3px;">' + markers.join(' ') + '</div>');

            gridHtml += '<div class="qimen-cell">' + cells.join('') + '</div>';
        });
        document.getElementById('qimenGrid').innerHTML = gridHtml;

        document.getElementById('qimenLegend').innerHTML =
            '<span style="color:#c77dff;">天干紫色=击刑</span> <span style="color:#5b8def;">天干蓝色=入墓+击刑</span> <span style="color:#ff6b6b;">空亡</span> <span style="color:#4caf50;">马星</span> <span style="color:#888;">入墓=蓝标</span>';
        document.getElementById('qimenResult').scrollIntoView({ behavior: 'smooth' });
    }

    </script>
